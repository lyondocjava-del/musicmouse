name: build
on: [push]
jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Install signing assets
        env:
          CERT_P12: ${{ secrets.CERT_P12 }}
          CERT_P12_PASSWORD: ${{ secrets.CERT_P12_PASSWORD }}
          PROVISIONING_PROFILE: ${{ secrets.PROVISIONING_PROFILE }}
        run: |
          echo "$CERT_P12" | base64 --decode > /tmp/cert.p12
          echo "$PROVISIONING_PROFILE" | base64 --decode > /tmp/profile.mobileprovision
          security create-keychain -p "" build.keychain
          security default-keychain -s build.keychain
          security unlock-keychain -p "" build.keychain
          security import /tmp/cert.p12 -k build.keychain \
            -P "$CERT_P12_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple:,codesign: \
            -s -k "" build.keychain

      - name: Build (unsigned)
        run: |
          xcodebuild -project MusicMouse.xcodeproj -scheme MusicMouse \
            -sdk iphoneos -configuration Debug \
            CODE_SIGNING_ALLOWED=NO \
            -derivedDataPath build/dd build

      - name: Sign + package IPA
        run: |
          APP=build/dd/Build/Products/Debug-iphoneos/MusicMouse.app
          cp /tmp/profile.mobileprovision "$APP/embedded.mobileprovision"
          codesign --force --sign "Apple Development" \
            --entitlements entitlements.plist --timestamp=none "$APP"
          codesign -v "$APP"
          mkdir -p ipa/Payload
          cp -R "$APP" ipa/Payload/
          cd ipa && zip -qr ../MusicMouse.ipa Payload

      - uses: actions/upload-artifact@v4
        with:
          name: MusicMouse.ipa
          path: MusicMouse.ipa

      # --- App Store upload (dormant until distribution secrets exist) ---
      #   DIST_CERT_P12, DIST_CERT_P12_PASSWORD  (Apple Distribution identity)
      #   DIST_PROVISIONING_PROFILE            (App Store distribution profile)
      #   DIST_TEAM_ID                         (paid-team 10-char ID, e.g. GCS3W3G87A)
      #   APPLE_ID, APP_SPECIFIC_PASSWORD      (already set)
      # Then flip `if: false` to `if: true` and the archive/upload runs on every push.
      - name: Archive + upload to App Store Connect
        if: false
        env:
          DIST_CERT_P12: ${{ secrets.DIST_CERT_P12 }}
          DIST_CERT_P12_PASSWORD: ${{ secrets.DIST_CERT_P12_PASSWORD }}
          DIST_PROVISIONING_PROFILE: ${{ secrets.DIST_PROVISIONING_PROFILE }}
          DIST_PROFILE_UUID: ${{ secrets.DIST_PROFILE_UUID }}
          DIST_TEAM_ID: ${{ secrets.DIST_TEAM_ID }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APP_SPECIFIC_PASSWORD: ${{ secrets.APP_SPECIFIC_PASSWORD }}
        run: |
          echo "$DIST_CERT_P12" | base64 --decode > /tmp/dist.p12
          echo "$DIST_PROVISIONING_PROFILE" | base64 --decode \
            > /tmp/dist.mobileprovision
          security import /tmp/dist.p12 -k build.keychain \
            -P "$DIST_CERT_P12_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple:,codesign: \
            -s -k "" build.keychain
          mkdir -p "$HOME/Library/MobileDevice/Provisioning Profiles"
          cp /tmp/dist.mobileprovision "$HOME/Library/MobileDevice/Provisioning Profiles/"
          xcodebuild -project MusicMouse.xcodeproj -scheme MusicMouse \
            -sdk iphoneos -configuration Release \
            DEVELOPMENT_TEAM="$DIST_TEAM_ID" CODE_SIGN_STYLE=Manual \
            CODE_SIGN_IDENTITY="Apple Distribution" \
            -archivePath build/MusicMouse.xcarchive archive
          cat > ExportOptions.plist <<EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <plist version="1.0"><dict>
            <key>method</key><string>app-store</string>
            <key>signingStyle</key><string>manual</string>
            <key>teamID</key><string>$DIST_TEAM_ID</string>
            <key>provisioningProfiles</key><dict>
              <key>com.docjava.musicmouse</key><string>$DIST_PROFILE_UUID</string>
            </dict>
          </dict></plist>
          EOF
          xcodebuild -exportArchive -archivePath build/MusicMouse.xcarchive \
            -exportPath build/export -exportOptionsPlist ExportOptions.plist
          xcrun altool --upload-app -f build/export/MusicMouse.ipa \
            -u "$APPLE_ID" -p "$APP_SPECIFIC_PASSWORD" -t ios
