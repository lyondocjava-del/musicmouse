name: build
on: [push]
jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Install signing assets
        env:
          CERT_P12: ${{ secrets.CERT_P12 }}
          CERT_P12_PASSWORD: ${{ secrets.CERT_P12_PASSWORD }}
          PROVISIONING_PROFILE: ${{ secrets.PROVISIONING_PROFILE }}
        run: |
          echo "$CERT_P12" | base64 --decode > /tmp/cert.p12
          echo "$PROVISIONING_PROFILE" | base64 --decode > /tmp/profile.mobileprovision
          security create-keychain -p "" build.keychain
          security default-keychain -s build.keychain
          security unlock-keychain -p "" build.keychain
          security import /tmp/cert.p12 -k build.keychain \
            -P "$CERT_P12_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple:,codesign: \
            -s -k "" build.keychain

      - name: Build (unsigned)
        run: |
          xcodebuild -project Hello.xcodeproj -scheme Hello \
            -sdk iphoneos -configuration Debug \
            CODE_SIGNING_ALLOWED=NO \
            -derivedDataPath build/dd build

      - name: Sign + package IPA
        run: |
          APP=build/dd/Build/Products/Debug-iphoneos/Hello.app
          cp /tmp/profile.mobileprovision "$APP/embedded.mobileprovision"
          codesign --force --sign "Apple Development" \
            --entitlements entitlements.plist --timestamp=none "$APP"
          codesign -v "$APP"
          mkdir -p ipa/Payload
          cp -R "$APP" ipa/Payload/
          cd ipa && zip -qr ../Hello.ipa Payload

      - uses: actions/upload-artifact@v4
        with:
          name: Hello.ipa
          path: Hello.ipa
